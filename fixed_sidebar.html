<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세종대학교 맛집 지도</title>
    <style>
        /* 기본 여백 제거 및 폰트 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 1. 가장 왼쪽: 얇고 고정된 사이드바 */
        .sidebar {
            width: 80px; 
            min-width: 80px;
            background-color: #ffffff;
            border-right: 1px solid #e9ecef;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center; 
            gap: 15px;
            z-index: 20; 
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            color: #605c5c;
            width: 90%;
            transition: all 0.2s ease;
            font-size: 12px; /* 글자 크기 수정 */
            font-weight: 500;
        }
        .nav-item:hover, .nav-item.active {
            background-color: #f1f3f5;
            color: #f26969;
        }
        .nav-icon {
            font-size: 24px; 
        }

        /* 💡 추가: 사이드바를 제외한 나머지 화면 전체를 감싸는 영역 */
        .main-wrapper {
            flex: 1;
            position: relative; /* 내부 요소들의 띄우기 기준점이 됨 */
            display: flex;
            overflow: hidden;
        }

        /* 2. 상단 고정 검색창 (슬라이드 패널과 분리됨) */
        .fixed-search-header {
            position: absolute;
            top: 0; 
            left: 0;
            width: 390px; /* 패널 너비와 동일하게 맞춤 */
            padding: 20px;
            background-color: transparent;
            border: none;
            z-index: 15; /* 슬라이드 패널(10)보다 무조건 위에 오도록 설정 */
        }

        /* 검색창 스타일 (기존과 동일) */
        .search-container {
            display: flex;
        }
        .search-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #dacece;
            border-radius: 8px 0 0 8px;
            font-size: 15px;
            outline: none;
        }
        .search-input:focus { border-color: #f26969; }
        .search-btn {
            padding: 12px 20px;
            background-color: #f26969;
            color: white;
            border: none;
            border-radius: 0 8px 8px 0;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-btn:hover { background-color: #ee5353; }

        /* 3. 열고 닫히는 하단 패널 (카테고리 + 검색결과) */
        .search-panel {
            position: absolute;
            top: 0; 
            left: 0;
            width: 390px; 
            height: 100%;
            padding-top: 85px; /* 💡 핵심: 고정된 검색창 높이만큼 공간을 비워둠 */
            background-color: #ffffff;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            z-index: 10;
            transition: transform 0.3s ease; /* 부드러운 슬라이드 */
            box-shadow: 2px 0 15px rgba(0,0,0,0.05);
        }
        
        /* 화살표 버튼을 눌러서 닫혔을 때의 상태 */
        .search-panel.closed {
            transform: translateX(-100%); /* 왼쪽으로 100% 밀어서 숨김 */
        }

        /* 열기/닫기 화살표 버튼 */
        .panel-toggle-btn {
            position: absolute;
            top: 50%;
            right: -22px; 
            transform: translateY(-50%);
            width: 22px;
            height: 50px;
            background-color: #ffffff;
            border: 1px solid #e9ecef;
            border-left: none; 
            border-radius: 0 8px 8px 0;
            box-shadow: 2px 0 4px rgba(0,0,0,0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #495057;
            font-size: 12px;
            z-index: 15;
        }

        /* 필터 영역 컨테이너 */
        .filter-section {
            padding: 15px 20px;
            border-bottom: 1px solid #e9ecef;
        }
        .filter-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 7px 12px;
            border: 1px solid #ced4da;
            border-radius: 20px;
            background-color: white;
            color: #495057;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover { background-color: #f1f3f5; }
        .filter-btn.active { background-color: #f26969; color: white; border-color: #f26969; }

        /* 검색 결과 목록이 들어갈 빈 공간 */
        .search-results {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            color: #868e96;
            font-size: 14px;
            text-align: center;
        }

        /* 4. 오른쪽 지도 영역 (가장 밑에 깔림) */
        .main-content {
            width: 100%;
            height: 100%;
            background-color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 20px;
            font-weight: bold;
            z-index: 1; /* 지도 렌더링 영역은 최하단 */
        }
    </style>
</head>
<body>
    <!-- 1. 왼쪽 고정 사이드바 -->
    <nav class="sidebar">
        <a href="#" class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>홈</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">❤️</span>
            <span>저장</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">👤</span>
            <span>MY</span>
        </a>
    </nav>

    <!-- 2. 사이드바 우측 전체 영역 (지도 + 패널) -->
    <div class="main-wrapper">
        
        <!-- 고정된 상단 검색창 -->
        <div class="fixed-search-header">
            <div class="search-container">
                <input type="text" class="search-input" placeholder="세종대 주변 맛집 검색">
                <button class="search-btn">검색</button>
            </div>
        </div>

        <!-- 열고 닫히는 하단 패널 (필터 + 검색결과) -->
        <div class="search-panel" id="search-panel">
            <button id="panel-toggle-btn" class="panel-toggle-btn">◀</button>
            
            <div class="filter-section">
                <div class="filter-container">
                    <button class="filter-btn active">전체</button>
                    <button class="filter-btn">한식</button>
                    <button class="filter-btn">중식</button>
                    <button class="filter-btn">양식</button>
                    <button class="filter-btn">일식</button>
                    <button class="filter-btn">카페</button>
                </div>
            </div>

            <div class="search-results">
                검색 결과가 이곳에 나타납니다.
            </div>
        </div>

        <!-- 3. 지도 영역 -->
        <main class="main-content" id="map-container">
            지도가 렌더링될 빈 공간입니다.
        </main>
        
    </div>

    <!-- JavaScript 로직 -->
    <script>
        // 1. 하단 패널 열고 닫기 로직
        const searchPanel = document.getElementById('search-panel');
        const toggleBtn = document.getElementById('panel-toggle-btn');

        toggleBtn.addEventListener('click', () => {
            searchPanel.classList.toggle('closed');
            
            if (searchPanel.classList.contains('closed')) {
                toggleBtn.innerText = '▶';
            } else {
                toggleBtn.innerText = '◀';
            }
        });

        // 2. 카테고리 필터 버튼 활성화 로직
        const filterBtns = document.querySelectorAll('.filter-btn');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });
    </script>
</body>
</html>
