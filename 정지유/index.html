<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세종대학교 맛집 지도</title>
</head>

<body>
    <!-- 1. 왼쪽 고정 사이드바 -->
    <nav class="sidebar">
        <a href="#" class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>홈</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">❤️</span>
            <span>저장</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">👤</span>
            <span>MY</span>
        </a>
    </nav>

    <!-- 2. 사이드바 우측 전체 영역 (지도 + 패널) -->
    <div class="main-wrapper">
        
        <!-- 고정된 상단 검색창 -->
        <div class="fixed-search-header">
            <div class="search-container">
                <input type="text" class="search-input" placeholder="세종대 주변 맛집 검색">
                <button class="search-btn">검색</button>
            </div>
        </div>

        <!-- 열고 닫히는 하단 패널 (필터 + 검색결과) -->
        <div class="search-panel" id="search-panel">
            <button id="panel-toggle-btn" class="panel-toggle-btn">◀</button>
            
            <div class="filter-section">
                <div class="filter-container">
                    <button class="filter-btn active">전체</button>
                    <button class="filter-btn">한식</button>
                    <button class="filter-btn">중식</button>
                    <button class="filter-btn">양식</button>
                    <button class="filter-btn">일식</button>
                    <button class="filter-btn">카페</button>
                </div>
            </div>

            <div class="search-results">
                검색 결과가 이곳에 나타납니다.
            </div>
        </div>

        <!-- 3. 지도 영역 -->
        <main class="main-content" id="map-container">
            지도가 렌더링될 빈 공간입니다.
        </main>
        
    </div>
<script src="script.js"></script>
</body>
</html>
