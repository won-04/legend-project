<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐먹지</title>
    <link rel="stylesheet" href="./오늘_뭐먹.css">
     <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <!---------------------------------------------
    --------------가장 왼쪽 사이드바----------------
    ----------------------------------------------->
    <aside class="sidebar">
        <h2 class="logo">오먹</h2>
        <ul class="menu">
            <li class="menubtn">
                <a href="#" data-panel="default"><i class="fa-solid fa-bars"></i></a>
            </li>
            <li>
                <a href="#" data-panel="editor-pick">추천 랭킹</a>
            </li>
            
             <li>
                <a href="#" data-panel="editor-pick">오늘의<br>추천</a>
            </li>

            <li>
                <a href="#" data-panel="editor-pick">에디터픽</a>
            </li>

            <li>
                <a href="#" data-panel="hidden-report">숨.맛.공</a>
            </li>
            <li class="bookmark"><!--북마크-->
                <a href="#" data-panel="bookmark"><i class="fa-regular fa-bookmark"></i></a>
            </li>
            <li class="mypage"><!--마이페이지-->
                <a href="#"><i class="fa-regular fa-circle-user"></i></a>
            </li>
            <li class="setting"><!--설정-->
                <a href="#"><i class="fa-solid fa-gear"></i></a>
            </li>
        </ul>
    </aside>
     <!---------------------------------------------
    --------------메인 검색 및 결과----------------
    ----------------------------------------------->
    <main>
        <!---------------------------------------------
        -------------------검색박스---------------------
        ----------------------------------------------->
        <form id="search">
            <div class="search-box">
                <button type="submit" class="searchbox-button">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
                <input type="text" placeholder="검색" class="searchbox-input">
        
            </div>
        </form>

        <aside class="search-panel">
             <!---------------------------------------------
             ---------------검색패널 닫기 버튼---------------
             ----------------------------------------------->
            <button type="button" class="panel-close">
                <i class="fa-solid fa-circle-xmark"></i>
            </button>

            <!---------------------------------------------
             --------------------검색결과-------------------
             ----------------------------------------------->
            <section id="search-result">
                
            </section>
            
        </aside>

    <!---------------------------------------------
    -------------------지도API---------------------
    ----------------------------------------------->
        <div id="map">
            <p>지도</p>
        </div>

    </main>
    <script src="./오늘_뭐먹.js"></script>
</body>
</html>
