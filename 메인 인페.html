<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인 인터페이스</title>
    <link rel="stylesheet" href="스타일.css">
</head>

<body>

    <!-- ================================
         1. 왼쪽 아이콘 바
    ================================= -->
    <div class="icon-bar">

        <!-- 맨 위 메뉴 버튼 -->
        <button class="main-menu" aria-label="메뉴">☰</button>

        <!-- 기능 아이콘 목록 (아이콘 1개 = 버튼 1개) -->
        <ul class="icon-list">

            <!-- 랜덤 추천 -->
            <li>
                <button data-panel="randomRecommend" title="랜덤 추천" aria-label="랜덤 추천">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="16 3 21 3 21 8"/>
                        <line x1="4" y1="20" x2="21" y2="3"/>
                        <polyline points="21 16 21 21 16 21"/>
                        <line x1="15" y1="15" x2="21" y2="21"/>
                        <line x1="4" y1="4" x2="9" y2="9"/>
                    </svg>
                    <span class="label">랜덤</span>
                </button>
            </li>

            <!-- 앱 추천 -->
            <li>
                <button data-panel="appRecommend" title="앱 추천" aria-label="앱 추천">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                    <span class="label">앱추천</span>
                </button>
            </li>

            <!-- 북마크 -->
            <li>
                <button data-panel="bookmark" title="북마크" aria-label="북마크">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span class="label">북마크</span>
                </button>
            </li>

        </ul>

        <!-- 하단 그룹: 개인정보 + 설정 -->
        <div class="icon-bar-bottom">

            <!-- 개인정보 -->
            <button class="bottom-btn" title="개인정보" aria-label="개인정보">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span class="label">내 정보</span>
            </button>

            <!-- 설정 -->
            <button class="bottom-btn" title="설정" aria-label="설정">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                <span class="label">설정</span>
            </button>

        </div>

    </div>

    <!-- ================================
         2. 가운데 사이드바 (지도 위에 뜨는 패널)
    ================================= -->
    <aside class="sidebar">

        <!-- 검색창 -->
        <div class="search-box">
            <input type="text" placeholder=" OOOO 지도 검색">
            <button class="search-word">
                <!-- 돋보기 SVG: 원(circle) + 손잡이(line) -->
                <svg xmlns="http://www.w3.org/2000/svg"
                     width="18" height="18"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round">
                    <circle cx="11" cy="11" r="7"/>
                    <line x1="21" y1="21" x2="16" y2="16"/>
                </svg>
            </button>
        </div>

        <!-- 음식 테마 카테고리 바 (중간바(full)에서만 표시 / 4개씩 2줄 + 더보기, 글씨만) -->
        <div class="category-bar">
            <button class="category-chip">한식</button>
            <button class="category-chip">중식</button>
            <button class="category-chip">일식</button>
            <button class="category-chip">양식</button>
            <button class="category-chip">분식</button>
            <button class="category-chip">치킨</button>
            <button class="category-chip">고기</button>
            <button class="category-chip extra">카페</button>
            <button class="category-chip extra">디저트</button>
            <button class="category-chip extra">피자</button>
            <!-- 접힌 개수만큼 +N 표시, 누르면 펼침/접힘 -->
            <button class="category-more" type="button">+3</button>
        </div>

        <!-- 검색 결과 패널 (평소엔 숨김, 검색하면 보임) -->
        <ul class="result-list">
        </ul>


        <!-- 기능 패널 영역 -->
        <div class="panel-section">

             <!-- 북마크 -->
            <div class="panel" id="bookmark">
               <h1>북마크</h1>
            </div>

            <!-- 랜덤 추천 -->
            <div class="panel" id="randomRecommend">

                <!-- STEP 1 -->
                <div class="step active" id="step1">
                    <h1>오늘 뭐 먹지?</h1>
                    <button id="startBtn">시작하기</button>
                </div>

                <!-- STEP 2 -->
                <div class="step" id="step2">
                    <h1>현재 남는 시간</h1>
                    <button>바쁨</button>
                    <button>널널함</button>
                    <button>상관없음</button>
                </div>

                <!-- STEP 3 -->
                <div class="step" id="step3">
                    <h1>가격</h1>
                    <button>가성비</button>
                    <button>가심비</button>
                    <button>상관없음</button>
                </div>

                <!-- STEP 4 -->
                <div class="step" id="step4">
                    <h1>종류</h1>
                    <button>한식</button>
                    <button>중식</button>
                    <button>양식</button>
                    <button>상관없음</button>
                </div>

                <!-- STEP 5 -->
                <div class="step" id="step5">
                    <h1>추천 결과</h1>
                    <div id="recommendResult"></div>
                </div>

            </div>

            <!-- 앱 추천 -->
            <div class="panel" id="appRecommend">
                <h1>앱 추천</h1>
            </div>

        </div>

    </aside>

    <!-- ================================
         3. 오른쪽 지도 구역
    ================================= -->
    <main class="map-ui">
        <!-- 프로토타입용 지도 사진 (나중에 네이버 지도 API로 교체 예정) -->
        <figure>
            <img src="지도 사진.jpg" alt="지도">
        </figure>
    </main>

    <script src="기능.js"></script>

</body>

</html>
