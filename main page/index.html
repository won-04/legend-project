<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐먹지 | 맛집 지도</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <!-- ===== 1. 사이드바 ===== -->
    <aside class="sidebar">

        <!-- 메뉴 바 버튼 -->
        <button class="menu-bar-btn" type="button" data-panel="default" title="메뉴" aria-label="메뉴">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round">
                <line x1="4" y1="7" x2="20" y2="7" />
                <line x1="4" y1="12" x2="20" y2="12" />
                <line x1="4" y1="17" x2="20" y2="17" />
            </svg>
        </button>

        <!-- 기능 메뉴 -->
        <ul class="menu">

            <!-- 오늘의 추천 -->
            <li>
                <button class="menu-btn" type="button" data-panel="today"
                        title="오늘의 추천" aria-label="오늘의 추천">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="16 3 21 3 21 8" />
                        <line x1="4" y1="20" x2="21" y2="3" />
                        <polyline points="21 16 21 21 16 21" />
                        <line x1="15" y1="15" x2="21" y2="21" />
                        <line x1="4" y1="4" x2="9" y2="9" />
                    </svg>
                    <span class="menu-label">오늘의 추천</span>
                </button>
            </li>

            <!-- 에디터픽 -->
            <li>
                <button class="menu-btn" type="button" data-panel="editor-pick"
                        title="에디터픽" aria-label="에디터픽">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                    </svg>
                    <span class="menu-label">에디터픽</span>
                </button>
            </li>

            <!-- 숨.맛.공 -->
            <li>
                <button class="menu-btn" type="button" data-panel="hidden-report"
                        title="숨.맛.공" aria-label="숨은 맛집 공유">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z" />
                        <circle cx="12" cy="10" r="2.5" />
                    </svg>
                    <span class="menu-label">숨.맛.공</span>
                </button>
            </li>
            
            <!-- 추천 랭킹 -->
            <li>
                <button class="menu-btn" type="button" data-panel="ranking"
                        title="추천 랭킹" aria-label="추천 랭킹">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="13" width="5" height="8" rx="1" />
                        <rect x="9.5" y="6" width="5" height="15" rx="1" />
                        <rect x="16" y="16" width="5" height="5" rx="1" />
                    </svg>
                    <span class="menu-label">추천 랭킹</span>
                </button>
            </li>
        </ul>

        <!-- 하단 그룹: 북마크 / MY / 설정 -->
        <div class="sidebar-bottom">

            <!-- 북마크 -->
            <button class="menu-btn" type="button" data-panel="bookmark"
                    title="북마크" aria-label="북마크">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
                </svg>
                <span class="menu-label">북마크</span>
            </button>

            <!-- 마이페이지 -->
            <button class="menu-btn" type="button" title="마이페이지" aria-label="마이페이지">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
                <span class="menu-label">MY</span>
            </button>

            <!-- 설정 -->
            <button class="menu-btn" type="button" title="설정" aria-label="설정">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3" />
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
                <span class="menu-label">설정</span>
            </button>

        </div>

    </aside>


    <!-- ===== 2. 메인 영역 (검색창 · 패널 · 지도) ===== -->
    <div class="main-wrapper">

        <!-- 2-1. 검색창 (패널과 별개로 항상 표시) -->
        <div class="search-header">
            <form class="search-box" id="search-form">
                <input type="text" class="search-input" placeholder="세종대 주변 맛집 검색"
                       aria-label="맛집 검색">
                <button type="submit" class="search-btn" aria-label="검색">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round">
                        <circle cx="11" cy="11" r="7" />
                        <line x1="21" y1="21" x2="16" y2="16" />
                    </svg>
                </button>
            </form>
        </div>

        <!-- 2-2. 검색 패널 -->
        <section class="search-panel" id="search-panel" aria-label="검색 결과 패널">

            <!-- 열기/닫기 토글 버튼 -->
            <button class="panel-toggle-btn" id="panel-toggle-btn" type="button"
                    aria-label="검색 패널 닫기" aria-expanded="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6" />
                </svg>
            </button>

            <!-- 음식 종류 필터 -->
            <div class="filter-section">
                <div class="filter-container">
                    <button class="filter-btn active" type="button" data-category="all">전체</button>
                    <button class="filter-btn" type="button" data-category="korean">한식</button>
                    <button class="filter-btn" type="button" data-category="chinese">중식</button>
                    <button class="filter-btn" type="button" data-category="western">양식</button>
                    <button class="filter-btn" type="button" data-category="japanese">일식</button>
                    <button class="filter-btn" type="button" data-category="cafe">카페</button>
                </div>
            </div>

            <!-- 패널 본문 (JS가 내용을 그림) -->
            <div class="panel-body" id="panel-body"></div>

        </section>

        <!-- 2-3. 지도 (네이버 지도가 들어감) -->
        <main class="map-area" id="map">
            <p class="map-placeholder">지도가 들어갈 영역</p>
        </main>

    </div>

    <!-- [Modified] Supabase 라이브러리 (window.supabase 생성) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 네이버 지도 Client ID, Supabase URL·키 (README 참고) -->
    <script src="JS/config.local.js"></script>
    <script src="JS/main.js"></script>
</body>

</html>
